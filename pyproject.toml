[project]
name = "real-time-financial-kyc-data-platform"
version = "0.1.0"
description = "Portfolio-grade real-time KYC data platform."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = [".", "spark_jobs/src", "ingestion"]
testpaths = ["tests"]
