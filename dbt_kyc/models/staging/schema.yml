version: 2

models:
  - name: stg_kyc__events
    description: Typed KYC events from the Silver lakehouse layer.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: [CUSTOMER_ONBOARDED, DOCUMENT_UPLOADED, DOCUMENT_CONTROL_COMPLETED, IDENTITY_VERIFICATION_COMPLETED, WATCHLIST_SCREENING_COMPLETED, RISK_SCORE_UPDATED, CASE_DECISIONED]
      - name: risk_score
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
              config:
                where: "risk_score is not null"
